<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายการสั่งซื้อ | Body Scent</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <style>
    .page-title { font-size: clamp(2rem, 3vw + 1rem, 3rem); }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
    }
    #ordersTable {
      width: 100%;
      min-width: 52rem;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    #ordersTable th,
    #ordersTable td {
      padding: 0.85rem 1rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line-soft);
    }
    #ordersTable thead th {
      font-weight: 500;
      white-space: nowrap;
      color: var(--ink);
      background: var(--cream);
      border-bottom: 1px solid var(--line);
    }
    #ordersTable tbody tr:last-child td { border-bottom: 0; }
    #ordersTable tbody td:first-child { white-space: nowrap; }
    #ordersTable tbody td { color: var(--umber); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section__head">
          <h1 class="page-title">รายการสั่งซื้อ</h1>
          <hr class="divider">
          <p>คำสั่งซื้อทั้งหมด เรียงจากรายการล่าสุดขึ้นก่อน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร/Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>Body Scent</span>
      <span>&copy; 2026 Body Scent สงวนลิขสิทธิ์</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
